<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#bg)"/>
  <!-- AC Indoor Unit -->
  <rect x="120" y="120" width="360" height="130" rx="15" fill="#ffffff" shadow="0 20px 25px rgba(0,0,0,0.5)"/>
  <rect x="140" y="220" width="320" height="12" rx="4" fill="#e2e8f0"/>
  <!-- Display Panel -->
  <rect x="400" y="150" width="60" height="30" rx="6" fill="#0f172a"/>
  <text x="430" y="172" font-family="monospace" font-size="16" font-weight="bold" fill="#38bdf8" text-anchor="middle">18°C</text>
  <!-- Cool Air Breeze waves -->
  <path d="M 180 260 Q 210 280 240 260 Q 270 240 300 260" stroke="#38bdf8" stroke-width="4" fill="none" opacity="0.8"/>
  <path d="M 280 270 Q 310 290 340 270 Q 370 250 400 270" stroke="#38bdf8" stroke-width="4" fill="none" opacity="0.8"/>
  <!-- Title Badge -->
  <rect x="150" y="360" width="300" height="45" rx="10" fill="rgba(255,255,255,0.08)"/>
  <text x="300" y="388" font-family="sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Singer 1.5 Ton Inverter AC</text>
</svg>
