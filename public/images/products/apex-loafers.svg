<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#271c19"/>
      <stop offset="100%" stop-color="#442820"/>
    </linearGradient>
    <linearGradient id="leather" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#bg)"/>
  <!-- Shoe Silhouette -->
  <path d="M 120 250 C 150 180, 260 170, 340 180 C 420 190, 480 230, 480 270 L 120 270 Z" fill="url(#leather)"/>
  <rect x="110" y="270" width="380" height="25" rx="8" fill="#18181b"/>
  <!-- Stitching lines -->
  <path d="M 160 220 Q 250 190 350 205" stroke="#d97706" stroke-width="3" stroke-dasharray="6,4" fill="none"/>
  <!-- Title Badge -->
  <rect x="150" y="350" width="300" height="45" rx="10" fill="rgba(255,255,255,0.08)"/>
  <text x="300" y="378" font-family="sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Apex Genuine Leather Loafer</text>
</svg>
