      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="case" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#bg)"/>
  <circle cx="300" cy="225" r="160" fill="#0284c7" opacity="0.1"/>
  <!-- Earbud Case -->
  <rect x="200" y="160" width="200" height="150" rx="40" fill="url(#case)" shadow="0 20px 25px rgba(0,0,0,0.5)"/>
  <rect x="220" y="180" width="160" height="8" rx="4" fill="#0f172a" opacity="0.3"/>
  <circle cx="300" cy="235" r="6" fill="#38bdf8"/>
  <!-- Earbuds Left & Right -->
  <path d="M 230 110 Q 230 80 250 80 Q 270 80 270 110 L 255 160 L 245 160 Z" fill="#ffffff"/>
  <path d="M 330 110 Q 330 80 350 80 Q 370 80 370 110 L 355 160 L 345 160 Z" fill="#ffffff"/>
  <circle cx="240" cy="100" fill="#0284c7" r="8"/>
  <circle cx="360" cy="100" fill="#0284c7" r="8"/>
  <!-- Title Badge -->
  <rect x="150" y="350" width="300" height="45" rx="10" fill="rgba(255,255,255,0.08)"/>
  <text x="300" y="378" font-family="sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Walton Airbuds Pro ANC</text>
