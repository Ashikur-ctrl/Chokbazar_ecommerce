<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f4f4f5"/>
      <stop offset="50%" stop-color="#e4e4e7"/>
      <stop offset="100%" stop-color="#a1a1aa"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#bg)"/>
  <!-- Cooker Body -->
  <rect x="180" y="140" width="240" height="180" rx="30" fill="url(#metal)"/>
  <ellipse cx="300" cy="140" rx="120" ry="20" fill="#71717a"/>
  <!-- Handle Lid -->
  <rect x="250" y="90" width="100" height="30" rx="15" fill="#18181b"/>
  <!-- Switch panel -->
  <rect x="260" y="220" width="80" height="60" rx="10" fill="#dc2626"/>
  <circle cx="280" cy="250" r="8" fill="#fbbf24"/>
  <circle cx="320" cy="250" r="8" fill="#22c55e"/>
  <!-- Title Badge -->
  <rect x="150" y="360" width="300" height="45" rx="10" fill="rgba(255,255,255,0.08)"/>
  <text x="300" y="388" font-family="sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Miyako 1.8L Rice Cooker</text>
</svg>
