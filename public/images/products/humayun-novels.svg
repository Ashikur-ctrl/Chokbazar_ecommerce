<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#bg)"/>
  <!-- Stack of Hardcover Books -->
  <rect x="180" y="240" width="240" height="45" rx="5" fill="#dc2626" stroke="#fbbf24" stroke-width="2"/>
  <rect x="190" y="190" width="220" height="45" rx="5" fill="#2563eb" stroke="#fbbf24" stroke-width="2"/>
  <rect x="200" y="140" width="200" height="45" rx="5" fill="#16a34a" stroke="#fbbf24" stroke-width="2"/>
  <text x="300" y="168" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">মিসির আলি সমগ্র</text>
  <text x="300" y="218" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">হিমু সমগ্র</text>
  <text x="300" y="268" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">জোছনা ও জননীর গল্প</text>
  <!-- Title Badge -->
  <rect x="150" y="360" width="300" height="45" rx="10" fill="rgba(255,255,255,0.08)"/>
  <text x="300" y="388" font-family="sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Humayun Ahmed Novel Set</text>
</svg>
