      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#292524"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#bg)"/>
  <!-- Strap -->
  <rect x="270" y="50" width="60" height="320" rx="10" fill="#44403c"/>
  <!-- Dial Capsule -->
  <rect x="250" y="140" width="100" height="170" rx="45" fill="#09090b" stroke="#f97316" stroke-width="4"/>
  <rect x="260" y="155" width="80" height="140" rx="35" fill="#18181b"/>
  <!-- Screen Elements -->
  <text x="300" y="210" font-family="monospace" font-size="32" font-weight="bold" fill="#f97316" text-anchor="middle">10:45</text>
  <path d="M 280 240 Q 300 230 320 245" stroke="#ef4444" stroke-width="4" fill="none"/>
  <text x="300" y="270" font-family="sans-serif" font-size="14" fill="#a8a29e" text-anchor="middle">7,820 steps</text>
