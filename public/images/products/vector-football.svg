<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#bg)"/>
  <!-- Football Circle -->
  <circle cx="300" cy="200" r="110" fill="#ffffff" stroke="#18181b" stroke-width="4"/>
  <!-- Pentagon Center -->
  <polygon points="300,160 335,185 322,225 278,225 265,185" fill="#18181b"/>
  <!-- Connecting Hexagon Lines -->
  <line x1="300" y1="160" x2="300" y2="110" stroke="#18181b" stroke-width="4"/>
  <line x1="335" y1="185" x2="380" y2="170" stroke="#18181b" stroke-width="4"/>
  <line x1="322" y1="225" x2="360" y2="260" stroke="#18181b" stroke-width="4"/>
  <line x1="278" y1="225" x2="240" y2="260" stroke="#18181b" stroke-width="4"/>
  <line x1="265" y1="185" x2="220" y2="170" stroke="#18181b" stroke-width="4"/>
  <!-- Title Badge -->
  <rect x="150" y="360" width="300" height="45" rx="10" fill="rgba(255,255,255,0.08)"/>
  <text x="300" y="388" font-family="sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Vector X Pro Match Football</text>
</svg>
