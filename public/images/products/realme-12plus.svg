<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="phone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#bg)"/>
  <!-- Phone Body -->
  <rect x="220" y="60" width="160" height="300" rx="28" fill="url(#phone)"/>
  <rect x="226" y="66" width="148" height="288" rx="22" fill="#000000"/>
  <!-- Screen Wallpaper -->
  <rect x="230" y="70" width="140" height="280" rx="18" fill="#111827"/>
  <circle cx="300" cy="180" r="45" fill="#10b981" opacity="0.3"/>
  <circle cx="300" cy="180" r="25" fill="#34d399" opacity="0.6"/>
  <!-- Camera Punchhole -->
  <circle cx="300" cy="85" r="4" fill="#000000"/>
  <!-- Title Badge -->
  <rect x="150" y="380" width="300" height="45" rx="10" fill="rgba(255,255,255,0.08)"/>
  <text x="300" y="408" font-family="sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Realme 12+ 5G Smartphone</text>
</svg>
