<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_10 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_10" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_10');
  const devicePixelRatio = window.devicePixelRatio || 1;
  
const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });

renderer.setSize(width, height);
renderer.setPixelRatio(window.devicePixelRatio);
container.appendChild(renderer.domElement);

// Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
scene.add(ambientLight);

const pointLight = new THREE.PointLight(0x2563EB, 1);
pointLight.position.set(5, 5, 5);
scene.add(pointLight);

// Create a premium "Package" box
const geometry = new THREE.BoxGeometry(2, 1.2, 2);

// Custom "Kinetic" blue material with subtle glow
const material = new THREE.MeshPhongMaterial({
    color: 0x0F172A,
    specular: 0x2563EB,
    shininess: 100,
    transparent: true,
    opacity: 0.9
});

const box = new THREE.Mesh(geometry, material);
scene.add(box);

// Add some "tape" or details to the box using simple lines/planes
const tapeGeometry = new THREE.PlaneGeometry(2.1, 0.3);
const tapeMaterial = new THREE.MeshPhongMaterial({ color: 0x2563EB, side: THREE.DoubleSide });
const tape = new THREE.Mesh(tapeGeometry, tapeMaterial);
tape.position.y = 0.55;
tape.rotation.x = Math.PI / 2;
box.add(tape);

const tapeVertical = new THREE.Mesh(new THREE.PlaneGeometry(0.3, 1.3), tapeMaterial);
tapeVertical.position.z = 1.01;
box.add(tapeVertical);

camera.position.z = 5;
camera.position.y = 1;
camera.lookAt(0, 0, 0);

// Animation Loop
function animate() {
    requestAnimationFrame(animate);
    
    // Floating and rotating motion
    box.rotation.y += 0.005;
    box.rotation.x += 0.002;
    box.position.y = Math.sin(Date.now() * 0.002) * 0.1;
    
    renderer.render(scene, camera);
}

animate();

// Handle Resize
window.addEventListener('resize', () => {
    const newWidth = container.clientWidth || window.innerWidth;
    const newHeight = container.clientHeight || window.innerHeight;
    camera.aspect = newWidth / newHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(newWidth, newHeight);
});

// Cleanup (handled by platform, but good practice)
return () => {
    renderer.dispose();
    geometry.dispose();
    material.dispose();
};

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_10 -->
</body>
</html>
